spring.application.name=talento

# ---------------------------------------------------------------
# BASE DE DATOS - SQL Server / Azure SQL
# Sobrescribe ECOPETROL_DB_URL si el servidor o nombre de BD cambia.
# Perfil H2 local: --spring.profiles.active=local
# ---------------------------------------------------------------
spring.datasource.url=${ECOPETROL_DB_URL:jdbc:sqlserver://sqlserver-ecopetrol.database.windows.net:1433;databaseName=ecopetroldb;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${ECOPETROL_DB_USERNAME:sqlserver-ecopetrol-admin}
spring.datasource.password=${ECOPETROL_DB_PASSWORD:Demoecoppetrol26**}

spring.h2.console.enabled=false

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Ejecuta datos/vista DESPUES de que Hibernate crea/actualiza las tablas.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-sqlserver.sql
spring.sql.init.data-locations=classpath:data-sqlserver.sql,classpath:view-sqlserver.sql
spring.sql.init.continue-on-error=false

# ---------------------------------------------------------------
# MAIL
# ---------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

#APPLICATION INSIGHTS
APPLICATIONINSIGHTS_CONNECTION_STRING=InstrumentationKey=10cdac8a-a6a6-4847-a144-a4c50e52c888;IngestionEndpoint=https://centralus-2.in.applicationinsights.azure.com/;LiveEndpoint=https://centralus.livediagnostics.monitor.azure.com/;ApplicationId=fdefb782-8f6f-4eb5-94dd-076c65880b54

# Puerto del servidor
server.port=8080
