spring.application.name=talento

# ---------------------------------------------------------------
# BASE DE DATOS – H2 en memoria (desarrollo local sin MySQL)
# Para producción/Azure reemplazar por el bloque MySQL de abajo
# ---------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:talentodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola H2 accesible en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Ejecuta data.sql DESPUES de que Hibernate crea las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

