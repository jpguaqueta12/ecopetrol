<header class="topbar" role="banner">
  <button class="hamburger" aria-label="Abrir menú" type="button" [ariaExpanded]="!isSidebarClosed"
    (click)="toggleSidebar()">
    <span class="hamburger-icon" aria-hidden="true">☰</span>
  </button>

  <div class="brand">
    <div class="logo" aria-hidden="true">NTT</div>
    <div class="brand-text">DATA</div>
  </div>
</header>

<div class="app" role="application">

  <nav class="sidebar" [class.closed]="isSidebarClosed">
    <div class="menu-title">
      <span>Menu</span>
    </div>
    <ul class="menu-list">

      <li class="menu-item" routerLink="/dashboard" routerLinkActive="active">
        <span class="icon"><i class="fas fa-home" aria-hidden="true"></i></span>
        <span>Home</span>
      </li>

      <li class="menu-item" routerLink="/vacation" routerLinkActive="active">
        <span class="icon"><i class="fas fa-plane" aria-hidden="true"></i></span>
        <span>Vacaciones</span>
      </li>

      <li class="menu-item" routerLink="/disabilities" routerLinkActive="active">
        <span class="icon"><i class="fas fa-clinic-medical" aria-hidden="true"></i></span>
        <span>Incapacidad</span>
      </li>

      <li class="menu-item" routerLink="/calamity" routerLinkActive="active">
        <span class="icon"><i class="fas fa-exclamation-triangle" aria-hidden="true"></i></span>
        <span>Calamidad</span>
      </li>

      <li class="menu-item" routerLink="/birthday" routerLinkActive="active">
        <span class="icon"><i class="fas fa-birthday-cake" aria-hidden="true"></i></span>
        <span>Día de Cumpleaños</span>
      </li>
    </ul>
  </nav>

  <!-- Capa oscura móvil interactiva -->
  <div class="overlay" [class.show]="!isSidebarClosed" (click)="toggleSidebar()">
  </div>

  <main class="main" [class.full]="isSidebarClosed">
    <div class="card">
      <!-- Mensajes de éxito y error -->
      <div *ngIf="successMessage" class="alert alert-success">
        {{ successMessage }}
      </div>
      <div *ngIf="errorMessage" class="alert alert-error">
        {{ errorMessage }}
      </div>
      <!-- Cabecera de la solicitud -->
      <div class="form-header">
        <div class="form-title">
          <h2>Solicitud de Incapacidad</h2>
          <i class="far fa-question-circle info-icon" aria-hidden="true"></i>
        </div>
      </div>

      <!-- Cuerpo de dos columnas -->
      <div class="form-body">

        <!-- Ilustración de Salud (Columna Izquierda) -->
        <div class="illustration-pane" aria-hidden="true">
          <svg viewBox="0 0 500 400" width="100%" height="100%">
            <!-- Fondo / Suelo decorativo -->
            <ellipse cx="220" cy="340" rx="180" ry="14" fill="#f1f5f9" />
            <!-- Silueta abstracta del Corazón e impulsos -->
            <circle cx="280" cy="180" r="55" fill="#6366f1" />
            <path d="M 245 180 L 260 180 L 268 155 L 278 205 L 288 165 L 295 185 L 302 180 L 315 180" stroke="#ffffff"
              stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
            <!-- Personal médico izquierdo -->
            <circle cx="140" cy="140" r="14" fill="#ffcbd1" />
            <path d="M 125 158 Q 140 155 155 158 L 155 270 Q 140 280 125 270 Z" fill="#ffffff" stroke="#cbd5e1"
              stroke-width="2" />
            <rect x="118" y="165" width="44" height="65" rx="10" fill="#ffffff" stroke="#cbd5e1" />
            <line x1="132" y1="270" x2="132" y2="335" stroke="#1e293b" stroke-width="8" stroke-linecap="round" />
            <line x1="148" y1="270" x2="148" y2="335" stroke="#1e293b" stroke-width="8" stroke-linecap="round" />
            <!-- Personal médico derecho -->
            <circle cx="380" cy="155" r="12" fill="#ffcbd1" />
            <path d="M 360 172 Q 380 170 400 172 L 392 280 L 368 280 Z" fill="#6366f1" />
            <line x1="373" y1="280" x2="365" y2="335" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
            <line x1="387" y1="280" x2="380" y2="335" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
            <!-- Portapapeles médico -->
            <rect x="330" y="190" width="30" height="42" rx="4" fill="#ffffff" stroke="#334155" stroke-width="2"
              transform="rotate(-10 330 190)" />
          </svg>
        </div>

        <!-- Inputs Reactivos (Columna Derecha) -->
        <form [formGroup]="incapacityForm" class="inputs-pane" novalidate>

          <!-- Fila 1: Empleado e Identificación -->
          <div class="row-triple">
            <div class="form-group">
              <label for="empNum">* Número de Empleado</label>
              <div class="select-wrapper">
                <select id="empNum" formControlName="employeeNumber">
                  <option value="" disabled selected>Buscar</option>
                  <option *ngFor="let emp of employeeList" [value]="emp.number">{{ emp.number }}</option>
                </select>
                <i class="fas fa-chevron-down arrow-icon"></i>
              </div>
            </div>

            <div class="form-group">
              <label for="empName">Nombre de Empleado</label>
              <input id="empName" formControlName="employeeName" type="text" readonly placeholder="Se autocompleta" />
            </div>

            <div class="form-group">
              <label for="bizUnit">* Unidad de Negocio</label>
              <div class="select-wrapper">
                <select id="bizUnit" formControlName="businessUnit">
                  <option value="" disabled selected>Seleccione unidad</option>
                  <option *ngFor="let unit of businessUnits" [value]="unit">{{ unit }}</option>
                </select>
                <i class="fas fa-chevron-down arrow-icon"></i>
              </div>
            </div>
          </div>

          <!-- Fila 2: Líder Administrativo -->
          <div class="row-single">
            <div class="form-group max-third">
              <label for="leader">* Nombre de Líder</label>
              <div class="select-wrapper">
                <select id="leader" formControlName="leaderName">
                  <option value="" disabled selected>Buscar</option>
                  <option *ngFor="let lead of leaders" [value]="lead">{{ lead }}</option>
                </select>
                <i class="fas fa-chevron-down arrow-icon"></i>
              </div>
            </div>
          </div>

          <!-- Fila 3: Parametrización de Incapacidad -->
          <div class="row-triple">
            <div class="form-group">
              <label for="incapType">* Tipo de Incapacidad</label>
              <div class="select-wrapper">
                <select id="incapType" formControlName="incapacityType">
                  <option value="" disabled selected>Seleccione tipo</option>
                  <option *ngFor="let type of incapacityTypes" [value]="type">{{ type }}</option>
                </select>
                <i class="fas fa-chevron-down arrow-icon"></i>
              </div>
            </div>

            <div class="form-group">
              <label for="healthEnt">* Entidad Salud</label>
              <div class="select-wrapper">
                <select id="healthEnt" formControlName="healthEntity">
                  <option value="" disabled selected>Seleccione entidad</option>
                  <option *ngFor="let ent of healthEntities" [value]="ent">{{ ent }}</option>
                </select>
                <i class="fas fa-chevron-down arrow-icon"></i>
              </div>
            </div>

            <div class="form-group">
              <label for="cat">* Categoría</label>
              <div class="select-wrapper">
                <select id="cat" formControlName="category">
                  <option value="" disabled selected>Seleccione categoría</option>
                  <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
                </select>
                <i class="fas fa-chevron-down arrow-icon"></i>
              </div>
            </div>
          </div>

          <!-- Fila 4: Control de Calendario y Días -->
          <div class="row-triple alignment-fix">
            <div class="form-group">
              <label for="start">* Fecha Inicio</label>
              <input id="start" formControlName="startDate" type="date" />
            </div>

            <div class="form-group">
              <label for="end">* Fecha Fin</label>
              <input id="end" formControlName="endDate" type="date" />
            </div>

            <div class="form-group days-counter-box">
              <span class="days-label">Total Días</span>
              <span class="days-value">{{ totalDays }}</span>
            </div>
          </div>

          <!-- Fila 5: Diagnóstico y Adjuntos (Estructura Dividida de la imagen) -->
          <div class="row-double-split">
            <div class="form-group">
              <label for="diag">
                * ¿Cuál es tu diagnostico?
                <span class="small-hint">Indicar el código y/o nombre del diagnostico</span>
              </label>
              <textarea id="diag" formControlName="diagnosis" rows="5"></textarea>
            </div>

            <!-- Caja Dropzone / Adjuntar Archivo conforme a la Imagen -->
            <div class="form-group">
              <label>* Documentos Adjuntos</label>
              <div class="upload-container">
                <span class="upload-status-text">{{ attachedFileName }}</span>
                <label class="file-stub-btn">
                  <i class="fas fa-paperclip" aria-hidden="true"></i> Adjuntar un archivo
                  <input type="file" (change)="onFileChange($event)" accept=".pdf,.png,.jpg,.jpeg"
                    style="display: none;" />
                </label>
              </div>
            </div>
          </div>

        </form>
      </div>

      <!-- Botones de Acción Externos Inferiores -->
      <div class="form-footer">
        <button class="back-btn" type="button" (click)="onGoBack()" [disabled]="isLoading">
          Volver
        </button>

        <button class="submit-btn"
                type="button"
                [disabled]="incapacityForm.invalid || isLoading"
                (click)="onSubmit()">

          <span *ngIf="!isLoading">Enviar</span>

          <span *ngIf="isLoading">
            <i class="fas fa-spinner fa-spin"></i> Enviando...
          </span>

        </button>
      </div>
    </div>
  </main>
</div>
