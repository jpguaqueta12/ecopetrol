name: Deploy Backend - Spring Boot (ACI)

on:
  push:
    branches: [main]
    paths:
      - 'back/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: acrecopetrolntt.azurecr.io
  IMAGE_NAME: talento-back

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission to gradlew
        run: chmod +x back/talento/gradlew

      - name: Build JAR
        working-directory: back/talento
        run: ./gradlew clean bootJar --no-daemon

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: back/talento
          file: back/talento/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Restart ACI to pick up new image
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az container restart \
              --name aci-centralecopetrol \
              --resource-group rg-central-solucion-talento
            echo "ACI restarted — pulling ${ACR_LOGIN_SERVER}/${IMAGE_NAME}:latest (commit ${{ github.sha }})"
