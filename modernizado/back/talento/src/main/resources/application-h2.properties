# Perfil LOCAL con H2 en memoria (no toca ninguna base de datos real).
# Uso: ./gradlew bootRun --args='--spring.profiles.active=h2'
spring.datasource.url=jdbc:h2:mem:talento;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Hibernate crea las tablas; luego se siembra data.sql (sin scripts SQL Server)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false

# Sin correo en local
spring.mail.host=
spring.mail.username=
spring.mail.password=

spring.h2.console.enabled=true
