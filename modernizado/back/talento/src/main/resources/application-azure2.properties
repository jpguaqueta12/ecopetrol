# Perfil para conectar al Azure SQL del entorno 2 (ecopetroldb2).
# Uso: ECOPETROL_DB2_PASSWORD=*** ./gradlew bootRun --args='--spring.profiles.active=azure2'
spring.datasource.url=${ECOPETROL_DB2_URL:jdbc:sqlserver://sqlserver-ecopetrol2.database.windows.net:1433;databaseName=ecopetroldb2;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${ECOPETROL_DB2_USERNAME:sqlserver-ecopetrol-admin2}
spring.datasource.password=${ECOPETROL_DB2_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Primer arranque: solo conectar (no ejecutar scripts SQL Server).
spring.sql.init.mode=never

spring.mail.host=
spring.mail.username=
spring.mail.password=
